[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goodparse"
version = "0.1.0"
description = "Convert GoodNotes files to editable Xournal++ or Excalidraw documents, or PDF, preserving strokes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Franz Thiemann" }]
keywords = ["goodnotes", "xournal", "xournalpp", "excalidraw", "pdf", "notes", "converter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    # Full-fidelity PDF export (backgrounds + embedded photos + text) needs
    # Pillow to encode JPEGs and pypdfium2 to rasterise the vector background
    # paper PDFs.  The stroke-only converter still works if either is absent
    # (they are imported optionally in goodparse.pdf), but a normal install
    # gets both for the complete output.
    "Pillow>=10.0",
    "pypdfium2>=4.30",
]

[project.scripts]
goodparse = "goodparse.cli:main"
goodnotes2xournal = "goodparse.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
