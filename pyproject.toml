[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goodparse"
version = "0.1.0"
description = "Convert GoodNotes notebooks to editable Xournal++ or Excalidraw documents, or PDF: ink, shapes, text, images and paper."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Franz Thiemann" }]
keywords = ["goodnotes", "xournal", "xournalpp", "excalidraw", "pdf", "notes", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]
dependencies = [
    # Full-fidelity PDF export (backgrounds + embedded photos + text) needs
    # Pillow to encode JPEGs and pypdfium2 to rasterise the vector background
    # paper PDFs.  The stroke-only converter still works if either is absent
    # (they are imported optionally in goodparse.pdf), but a normal install
    # gets both for the complete output.
    "Pillow>=10.0",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/franzthiemann/goodparse"
Source = "https://github.com/franzthiemann/goodparse"
Issues = "https://github.com/franzthiemann/goodparse/issues"

[project.scripts]
goodparse = "goodparse.cli:main"
goodnotes2xournal = "goodparse.cli:main"

[project.optional-dependencies]
test = ["pytest"]
# Real-font embedding for PDF text (only used when the matching font is
# installed on the system; the base-14 Helvetica fallback needs nothing).
pdf-fonts = ["fontTools>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
